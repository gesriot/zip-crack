plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def keystorePath = file("../zipcrack-release.keystore")
def hasReleaseKeystore = keystorePath.exists()

android {
    namespace "com.zipcrack.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.zipcrack.app"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "1.5"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile keystorePath
                storePassword System.getenv("ZIPCRACK_KEYSTORE_PASSWORD") ?: "zipcrack"
                keyAlias System.getenv("ZIPCRACK_KEY_ALIAS") ?: "zipcrack"
                keyPassword System.getenv("ZIPCRACK_KEY_PASSWORD") ?: "zipcrack"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    // Pure-Java archives (no native 7zz — Linux binaries get SIGSYS on Android)
    implementation "net.lingala.zip4j:zip4j:2.11.5"
    implementation "org.apache.commons:commons-compress:1.26.2"
    implementation "org.tukaani:xz:1.9"
    implementation "commons-io:commons-io:2.15.1"
    // Encrypted DOCX/XLSX (OLE + EncryptionInfo) — POI crypt only, no full OOXML stack
    implementation "org.apache.poi:poi:5.2.5"
    implementation "commons-codec:commons-codec:1.16.0"
    implementation "org.apache.commons:commons-collections4:4.4"
    implementation "com.zaxxer:SparseBitSet:1.3"
    implementation "org.apache.logging.log4j:log4j-api:2.21.1"
}
